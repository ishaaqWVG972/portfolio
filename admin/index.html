<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Blog Admin | Ishaaq's Portfolio</title>
</head>
<body>
  <!-- Must be set BEFORE the CMS script loads to prevent auto-init from config.yml -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'ishaaqWVG972/portfolio',
          branch: 'main',
          base_url: 'https://ishaaq.vercel.app',
          auth_endpoint: '/api/auth'
        },
        media_folder: 'images/blog',
        public_folder: '/images/blog',
        collections: [
          {
            name: 'blog',
            label: 'Blog Posts',
            folder: 'content/blog',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Title', name: 'title', widget: 'string' },
              { label: 'Publish Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD' },
              { label: 'Excerpt', name: 'excerpt', widget: 'text' },
              { label: 'Featured Image', name: 'image', widget: 'image', required: false },
              { label: 'Body', name: 'body', widget: 'markdown' }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
