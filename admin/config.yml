backend:
  name: git-gateway
  branch: main

# Where uploaded images are stored
media_folder: "images/blog"
public_folder: "/images/blog"

# Site URL will be set automatically by Netlify

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date", "title"]
    summary: "{{title}} - {{date}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The title of your blog post"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        date_format: "MMMM YYYY"
        time_format: false
        hint: "When should this post be published?"

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "A short preview shown in the blog list (1-2 sentences)"

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Optional header image for the post"

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Write your blog post content here"
