backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Delete "{{path}}"'

# Where uploaded images are stored
media_folder: "images/blog"
public_folder: "/images/blog"

# Local backend for development (comment out for production)
# local_backend: true

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The title of your blog post"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        hint: "When should this post be published?"

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "A short preview shown in the blog list (1-2 sentences)"

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Optional header image for the post"

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Write your blog post content here"
