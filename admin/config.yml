backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/Portfolio  # UPDATE THIS with your GitHub username
  branch: main
  base_url: https://your-site.vercel.app  # UPDATE THIS with your Vercel URL
  auth_endpoint: /api/auth

# Where uploaded images are stored
media_folder: "images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The title of your blog post"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        hint: "When should this post be published?"

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "A short preview shown in the blog list (1-2 sentences)"

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Optional header image for the post"

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Write your blog post content here"
